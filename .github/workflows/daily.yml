name: 大会情報の毎日更新（AI不使用）
on:
  schedule:
    - cron: '0 15 * * *' # 00:00 JST; GitHub may start later during congestion.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: owcs-public-data
  cancel-in-progress: false
jobs:
  refresh:
    name: 公式大会データの取得
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: AIを使わず公式情報を取得・検査
        id: refresh
        continue-on-error: true
        run: python3 update.py
      - name: 正常データと取得結果を保存
        run: |
          git config user.name 'obatopi-data-bot'
          git config user.email 'obatopi-data-bot@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official OWCS data [skip ci]'
            git push
          fi
      - name: 公式データの検査失敗を通知
        if: steps.refresh.outcome == 'failure'
        run: exit 1
